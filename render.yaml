services:
  - type: web
    name: portfoliopro-api
    runtime: go
    rootDir: backend
    buildCommand: go build -o server .
    startCommand: ./server
    healthCheckPath: /api/health
    envVars:
      - key: GIN_MODE
        value: release
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: portfoliopro-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://portfoliopro.studio,https://www.portfoliopro.studio
      # Set manually in Render dashboard after creating Omise webhook:
      # OMISE_SECRET_KEY, OMISE_PUBLIC_KEY, OMISE_WEBHOOK_SECRET

databases:
  - name: portfoliopro-db
    plan: free
    databaseName: portfoliopro
    user: portfoliopro
